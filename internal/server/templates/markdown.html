<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peep</title>
<style>
/* Design tokens — canonical source: mono-repo .claude/skills/html-docs/template.html */
:root {
  --bg: #0d1117;          /* page canvas              (colors.background)    */
  --panel: #161b22;       /* cards, callouts          (colors.surface)       */
  --panel-2: #1c2230;     /* raised: table headers    (colors.surfaceRaised) */
  --border: #30363d;      /* hairline borders         (colors.border)        */
  --text: #e6edf3;        /* body text                (colors.onBackground)  */
  --muted: #9da7b3;       /* supporting text          (colors.onBackgroundMuted) */
  --accent: #58a6ff;      /* links, emphasis (blue)   (colors.primary)       */
  --accent-2: #7ee787;    /* headings, CLI (green)    (colors.secondary)     */
  --code-bg: #0b0f14;     /* code surface             (colors.codeSurface)   */
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0 auto;
  max-width: 880px;
  padding: 3rem 2rem 6rem;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.65;
}
h1, h2, h3, h4, h5, h6 {
  margin-top: 1.5rem;
  margin-bottom: 0.5rem;
  font-weight: 600;
  line-height: 1.25;
}
h2 { padding-bottom: .4rem; border-bottom: 1px solid var(--border); }
h3 { color: var(--accent-2); }
p, li { color: var(--text); }
pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.1rem;
  overflow-x: auto;
  font-size: .85rem;
  line-height: 1.55;
}
code {
  font-family: var(--mono);
  font-size: .86em;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: .1em .4em;
}
pre code {
  background: none;
  border: none;
  padding: 0;
  font-size: inherit;
}
table {
  border-collapse: collapse;
  width: 100%;
  margin: 1rem 0;
  font-size: .9rem;
}
th, td {
  border: 1px solid var(--border);
  padding: .55rem .7rem;
  text-align: left;
  vertical-align: top;
}
th { background: var(--panel-2); color: var(--text); font-weight: 600; }
tr:nth-child(even) td { background: rgba(255,255,255,.015); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
blockquote {
  border-left: 4px solid var(--accent);
  margin: 1.5rem 0;
  padding: 0 1rem;
  color: var(--muted);
}
hr { border: none; border-top: 1px solid var(--border); margin: 2.5rem 0; }
img { max-width: 100%; }
@media (max-width: 900px) {
  body { padding: 2rem 1.2rem 4rem; }
}
</style>
</head>

</html>
