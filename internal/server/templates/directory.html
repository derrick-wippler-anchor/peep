<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Path}}</title>
<style>
/* Design tokens — canonical source: mono-repo .claude/skills/html-docs/template.html */
:root {
  --bg: #0d1117;          /* page canvas              (colors.background)    */
  --panel: #161b22;       /* cards, callouts          (colors.surface)       */
  --border: #30363d;      /* hairline borders         (colors.border)        */
  --text: #e6edf3;        /* body text                (colors.onBackground)  */
  --muted: #9da7b3;       /* supporting text          (colors.onBackgroundMuted) */
  --accent: #58a6ff;      /* links, emphasis (blue)   (colors.primary)       */
}
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  max-width: 860px;
  margin: 0 auto;
  padding: 2rem 1rem;
}
h1 {
  font-size: 1rem;
  font-weight: 600;
  color: var(--muted);
  margin: 0 0 1rem 0;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
  word-break: break-all;
}
table {
  width: 100%;
  border-collapse: collapse;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
tr {
  border-top: 1px solid var(--border);
}
tr:first-child {
  border-top: none;
}
tr:hover {
  background-color: var(--panel);
}
td {
  padding: 0.5rem 1rem;
  vertical-align: middle;
}
td.icon {
  width: 2rem;
  padding-right: 0;
  color: var(--muted);
  font-size: 1rem;
}
td.raw {
  width: 3rem;
  text-align: right;
  padding-left: 0;
}
a {
  color: var(--accent);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
a.raw {
  font-size: 0.75rem;
  color: var(--muted);
}
a.raw:hover {
  color: var(--accent);
}
</style>
</head>
<body>
<h1>{{.Path}}</h1>
<table>
{{if .ShowParent}}
<tr>
  <td class="icon">&#128193;</td>
  <td><a href="../">../</a></td>
</tr>
{{end}}
{{range .Entries}}
<tr>
  <td class="icon">{{if .IsDir}}&#128193;{{else}}&#128196;{{end}}</td>
  <td><a href="{{.Href}}">{{.Name}}{{if .IsDir}}/{{end}}</a></td>
  <td class="raw">{{if .IsMarkdown}}<a class="raw" href="{{.Href}}?raw">raw</a>{{end}}</td>
</tr>
{{end}}
</table>
<script>var es = new EventSource('/__reload'); es.onmessage = function() { location.reload(); };</script>
</body>
</html>
